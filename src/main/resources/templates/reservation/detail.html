<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>予約詳細</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="section">
            <div class="detail-header">
                <h2 class="section-title">予約詳細 #<span th:text="${reservation.reservationId}"></span></h2>
                <span class="badge badge-confirmed" th:if="${reservation.status == 'CONFIRMED'}">確定</span>
                <span class="badge badge-pending" th:if="${reservation.status == 'PENDING'}">保留</span>
                <span class="badge badge-cancelled" th:if="${reservation.status == 'CANCELLED'}">キャンセル</span>
                <span class="badge badge-completed" th:if="${reservation.status == 'COMPLETED'}">完了</span>
            </div>
        </div>

        <div class="section">
            <div class="card">
                <div class="card-body">
                    <div class="detail-info">
                        <div class="detail-info-item">
                            <span class="detail-info-label">ツアー名</span>
                            <span class="detail-info-value" th:text="${reservation.tourName}"></span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">日程</span>
                            <span class="detail-info-value" th:text="${reservation.tourDate}"></span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">開始時刻</span>
                            <span class="detail-info-value" th:text="${reservation.startTime}"></span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">参加人数</span>
                            <span class="detail-info-value" th:text="${reservation.numParticipants} + '名'"></span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">合計金額</span>
                            <span class="detail-info-value" th:text="'¥' + ${#numbers.formatInteger(reservation.totalPrice, 1, 'COMMA')}"></span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">備考</span>
                            <span class="detail-info-value" th:text="${reservation.notes} ?: '−'"></span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">予約日時</span>
                            <span class="detail-info-value" th:text="${reservation.createdAt}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section" th:if="${not #lists.isEmpty(reservation.options)}">
            <h3 class="section-title">オプション</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>オプション名</th>
                            <th>数量</th>
                            <th>単価</th>
                            <th>小計</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="opt : ${reservation.options}">
                            <td th:text="${opt.optionName}"></td>
                            <td th:text="${opt.quantity}"></td>
                            <td th:text="'¥' + ${#numbers.formatInteger(opt.price, 1, 'COMMA')}"></td>
                            <td th:text="'¥' + ${#numbers.formatInteger(opt.subtotal, 1, 'COMMA')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section" th:if="${reservation.status == 'CONFIRMED'}">
            <div class="form-card">
                <h3 class="section-title">予約キャンセル</h3>
                <form th:action="@{/reservations/{id}/cancel(id=${reservation.reservationId})}" method="post"
                      onsubmit="return confirm('本当にキャンセルしますか？');">
                    <div class="form-group">
                        <label for="cancelReason">キャンセル理由</label>
                        <textarea id="cancelReason" name="cancelReason" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-danger">キャンセルする</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="section">
            <a th:href="@{/customer/mypage}" class="btn btn-outline">マイページへ戻る</a>
        </div>
    </div>
</div>
</body>
</html>

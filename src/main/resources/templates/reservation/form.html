<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>予約</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="section">
            <h2 class="section-title">予約</h2>

            <div class="card">
                <div class="card-body">
                    <h3 th:text="${tour.tourName}"></h3>
                    <p>エリア: <span th:text="${tour.area}"></span></p>
                    <p>料金: ¥<span th:text="${#numbers.formatInteger(tour.price, 1, 'COMMA')}"></span></p>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="form-card">
                <form th:action="@{/reservations/new}" th:object="${form}" method="post">
                    <input type="hidden" th:field="*{scheduleId}" />

                    <div class="form-group">
                        <label for="numParticipants">参加人数</label>
                        <input type="number" id="numParticipants" th:field="*{numParticipants}" class="form-control" min="1" />
                        <span class="form-error" th:if="${#fields.hasErrors('numParticipants')}" th:errors="*{numParticipants}"></span>
                    </div>

                    <div class="form-group">
                        <label for="notes">備考</label>
                        <textarea id="notes" th:field="*{notes}" class="form-control" rows="3"></textarea>
                        <span class="form-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></span>
                    </div>

                    <div class="section" th:if="${not #lists.isEmpty(options)}">
                        <h3 class="section-title">オプション</h3>
                        <div th:each="opt, stat : ${options}" class="form-group">
                            <div class="form-row">
                                <label>
                                    <input type="checkbox"
                                           th:name="'optionSelections[' + ${stat.index} + '].optionId'"
                                           th:value="${opt.optionId}" />
                                    <span th:text="${opt.optionName}"></span>
                                    （¥<span th:text="${#numbers.formatInteger(opt.price, 1, 'COMMA')}"></span>）
                                </label>
                                <input type="number"
                                       th:name="'optionSelections[' + ${stat.index} + '].quantity'"
                                       class="form-control" min="1" value="1" style="width: 80px;" />
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">予約を確定する</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>レポート</title>
</head>
<body>
<div layout:fragment="content">

    <nav class="admin-nav">
        <a th:href="@{/admin}">ダッシュボード</a>
        <a th:href="@{/admin/tours}">ツアー管理</a>
        <a th:href="@{/admin/reservations}">予約管理</a>
        <a th:href="@{/admin/customers}">顧客管理</a>
        <a th:href="@{/admin/reports}" class="active">レポート</a>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="section-title">レポート</h1>

            <div class="search-actions" style="margin-bottom: 1rem;">
                <a th:href="@{/admin/reports(type='sales', year=${year})}"
                   th:classappend="${reportType == 'sales'} ? ' btn-primary' : ''" class="btn">月次売上</a>
                <a th:href="@{/admin/reports(type='popularity', year=${year})}"
                   th:classappend="${reportType == 'popularity'} ? ' btn-primary' : ''" class="btn">ツアー人気</a>
                <a th:href="@{/admin/reports(type='occupancy', year=${year})}"
                   th:classappend="${reportType == 'occupancy'} ? ' btn-primary' : ''" class="btn">稼働率</a>
            </div>

            <form class="search-form" th:action="@{/admin/reports}" method="get">
                <input type="hidden" name="type" th:value="${reportType}" />
                <div class="form-row">
                    <div class="form-group">
                        <label for="year">年</label>
                        <select id="year" name="year" class="form-control">
                            <option th:each="y : ${#numbers.sequence(2024, 2030)}"
                                    th:value="${y}" th:text="${y} + '年'"
                                    th:selected="${y == year}">2026年</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="month">月</label>
                        <select id="month" name="month" class="form-control">
                            <option value="">全月</option>
                            <option th:each="m : ${#numbers.sequence(1, 12)}"
                                    th:value="${m}" th:text="${m} + '月'"
                                    th:selected="${m == month}">1月</option>
                        </select>
                    </div>
                </div>
                <div class="search-actions">
                    <button type="submit" class="btn btn-primary">表示</button>
                </div>
            </form>

            <div class="table-wrapper" th:if="${reportData != null and !reportData.isEmpty()}">
                <div th:switch="${reportType}">

                    <!-- 月次売上 -->
                    <table th:case="'sales'">
                        <thead>
                            <tr>
                                <th>月</th>
                                <th>予約件数</th>
                                <th>売上金額</th>
                                <th>参加者数</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${reportData}">
                                <td th:text="${row.month} + '月'">1月</td>
                                <td th:text="${row.reservationCount}">0</td>
                                <td th:text="'¥' + ${#numbers.formatInteger(row.totalSales, 1, 'COMMA')}">¥0</td>
                                <td th:text="${row.totalParticipants}">0</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- ツアー人気 -->
                    <table th:case="'popularity'">
                        <thead>
                            <tr>
                                <th>順位</th>
                                <th>ツアー名</th>
                                <th>予約数</th>
                                <th>参加者数</th>
                                <th>売上金額</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row, stat : ${reportData}">
                                <td th:text="${stat.count}">1</td>
                                <td th:text="${row.tourName}">ツアー名</td>
                                <td th:text="${row.reservationCount}">0</td>
                                <td th:text="${row.totalParticipants}">0</td>
                                <td th:text="'¥' + ${#numbers.formatInteger(row.totalSales, 1, 'COMMA')}">¥0</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- 稼働率 -->
                    <table th:case="'occupancy'">
                        <thead>
                            <tr>
                                <th>ツアー名</th>
                                <th>定員</th>
                                <th>参加者数</th>
                                <th>稼働率</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${reportData}">
                                <td th:text="${row.tourName}">ツアー名</td>
                                <td th:text="${row.maxParticipants}">0</td>
                                <td th:text="${row.totalParticipants}">0</td>
                                <td th:text="${row.occupancyRate} + '%'">0%</td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </div>

            <div class="alert" th:if="${reportData == null or reportData.isEmpty()}">
                <p>レポートデータがありません。</p>
            </div>
        </div>
    </section>

</div>
</body>
</html>

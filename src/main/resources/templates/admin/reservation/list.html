<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>予約管理</title>
</head>
<body>
<div layout:fragment="content">

    <nav class="admin-nav">
        <a th:href="@{/admin}">ダッシュボード</a>
        <a th:href="@{/admin/tours}">ツアー管理</a>
        <a th:href="@{/admin/reservations}" class="active">予約管理</a>
        <a th:href="@{/admin/customers}">顧客管理</a>
        <a th:href="@{/admin/reports}">レポート</a>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="section-title">予約管理</h1>

            <form class="search-form" th:action="@{/admin/reservations}" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label for="status">ステータス</label>
                        <select id="status" name="status" class="form-control">
                            <option value="">すべて</option>
                            <option value="CONFIRMED" th:selected="${status == 'CONFIRMED'}">確定</option>
                            <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">キャンセル</option>
                            <option value="COMPLETED" th:selected="${status == 'COMPLETED'}">完了</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dateFrom">開始日</label>
                        <input type="date" id="dateFrom" name="dateFrom" class="form-control" th:value="${dateFrom}" />
                    </div>
                    <div class="form-group">
                        <label for="dateTo">終了日</label>
                        <input type="date" id="dateTo" name="dateTo" class="form-control" th:value="${dateTo}" />
                    </div>
                </div>
                <div class="search-actions">
                    <button type="submit" class="btn btn-primary">検索</button>
                </div>
            </form>

            <p>全 <span th:text="${totalCount}">0</span> 件</p>

            <div class="table-wrapper">
                <table th:if="${reservations != null and !reservations.isEmpty()}">
                    <thead>
                        <tr>
                            <th>予約ID</th>
                            <th>顧客名</th>
                            <th>ツアー名</th>
                            <th>ツアー日</th>
                            <th>参加人数</th>
                            <th>合計金額</th>
                            <th>ステータス</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="res : ${reservations}">
                            <td th:text="${res.reservationId}">1</td>
                            <td th:text="${res.customerName}">顧客名</td>
                            <td th:text="${res.tourName}">ツアー名</td>
                            <td th:text="${#dates.format(res.tourDate, 'yyyy/MM/dd')}">2026/01/01</td>
                            <td th:text="${res.numParticipants}">1</td>
                            <td th:text="'¥' + ${#numbers.formatInteger(res.totalPrice, 1, 'COMMA')}">¥0</td>
                            <td>
                                <span class="badge-confirmed" th:if="${res.status == 'CONFIRMED'}">確定</span>
                                <span class="badge-cancelled" th:if="${res.status == 'CANCELLED'}">キャンセル</span>
                                <span class="badge-completed" th:if="${res.status == 'COMPLETED'}">完了</span>
                                <span class="badge-pending" th:if="${res.status == 'PENDING'}">保留</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="alert" th:if="${reservations == null or reservations.isEmpty()}">
                    <p>予約データがありません。</p>
                </div>
            </div>

            <div class="pagination" th:if="${totalPages > 1}">
                <a th:href="@{/admin/reservations(status=${status}, dateFrom=${dateFrom}, dateTo=${dateTo}, page=${page - 1})}"
                   th:if="${page > 1}" class="page-link">&laquo; 前へ</a>
                <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                    <a th:href="@{/admin/reservations(status=${status}, dateFrom=${dateFrom}, dateTo=${dateTo}, page=${i})}"
                       th:text="${i}" th:classappend="${i == page} ? ' active'" class="page-link">1</a>
                </th:block>
                <a th:href="@{/admin/reservations(status=${status}, dateFrom=${dateFrom}, dateTo=${dateTo}, page=${page + 1})}"
                   th:if="${page < totalPages}" class="page-link">次へ &raquo;</a>
            </div>
        </div>
    </section>

</div>
</body>
</html>

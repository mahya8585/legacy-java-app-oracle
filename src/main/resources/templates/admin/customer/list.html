<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>顧客管理</title>
</head>
<body>
<div layout:fragment="content">

    <nav class="admin-nav">
        <a th:href="@{/admin}">ダッシュボード</a>
        <a th:href="@{/admin/tours}">ツアー管理</a>
        <a th:href="@{/admin/reservations}">予約管理</a>
        <a th:href="@{/admin/customers}" class="active">顧客管理</a>
        <a th:href="@{/admin/reports}">レポート</a>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="section-title">顧客管理</h1>

            <form class="search-form" th:action="@{/admin/customers}" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label for="keyword">キーワード</label>
                        <input type="text" id="keyword" name="keyword" class="form-control"
                               th:value="${keyword}" placeholder="氏名・メールアドレス" />
                    </div>
                    <div class="form-group">
                        <label for="status">ステータス</label>
                        <select id="status" name="status" class="form-control">
                            <option value="">すべて</option>
                            <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">有効</option>
                            <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">無効</option>
                        </select>
                    </div>
                </div>
                <div class="search-actions">
                    <button type="submit" class="btn btn-primary">検索</button>
                </div>
            </form>

            <p>全 <span th:text="${totalCount}">0</span> 件</p>

            <div class="table-wrapper">
                <table th:if="${customers != null and !customers.isEmpty()}">
                    <thead>
                        <tr>
                            <th>顧客ID</th>
                            <th>氏名</th>
                            <th>メールアドレス</th>
                            <th>電話番号</th>
                            <th>ライセンスレベル</th>
                            <th>ダイブ本数</th>
                            <th>ステータス</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cust : ${customers}">
                            <td th:text="${cust.customerId}">1</td>
                            <td th:text="${cust.lastName} + ' ' + ${cust.firstName}">氏名</td>
                            <td th:text="${cust.email}">email@example.com</td>
                            <td th:text="${cust.phone}">090-0000-0000</td>
                            <td th:text="${cust.licenseLevel}">OW</td>
                            <td th:text="${cust.diveCount}">0</td>
                            <td>
                                <span class="badge-active" th:if="${cust.status == 'ACTIVE'}">有効</span>
                                <span class="badge-inactive" th:if="${cust.status != 'ACTIVE'}" th:text="${cust.status}">無効</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="alert" th:if="${customers == null or customers.isEmpty()}">
                    <p>顧客データがありません。</p>
                </div>
            </div>

            <div class="pagination" th:if="${totalPages > 1}">
                <a th:href="@{/admin/customers(keyword=${keyword}, status=${status}, page=${page - 1})}"
                   th:if="${page > 1}" class="page-link">&laquo; 前へ</a>
                <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                    <a th:href="@{/admin/customers(keyword=${keyword}, status=${status}, page=${i})}"
                       th:text="${i}" th:classappend="${i == page} ? ' active'" class="page-link">1</a>
                </th:block>
                <a th:href="@{/admin/customers(keyword=${keyword}, status=${status}, page=${page + 1})}"
                   th:if="${page < totalPages}" class="page-link">次へ &raquo;</a>
            </div>
        </div>
    </section>

</div>
</body>
</html>

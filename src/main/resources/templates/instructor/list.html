<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>インストラクター紹介</title>
</head>
<body>
<div layout:fragment="content">

    <section class="section">
        <div class="container">
            <h1 class="section-title">インストラクター紹介</h1>

            <div class="card-grid">
                <div class="card" th:each="instructor : ${instructors}">
                    <div class="card-body">
                        <h3 class="card-title" th:text="|${instructor.lastName} ${instructor.firstName}|">氏名</h3>
                        <p class="card-meta" th:text="${instructor.certification}">資格</p>
                        <p class="card-text" th:text="${instructor.specialty}">専門分野</p>
                        <p class="card-meta" th:text="|経験年数: ${instructor.experienceYears}年|">経験年数: 0年</p>
                    </div>
                    <div class="card-footer">
                        <a class="btn btn-primary" th:href="@{/instructors/{id}(id=${instructor.instructorId})}">詳細を見る</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

</div>
</body>
</html>

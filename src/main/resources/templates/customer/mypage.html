<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>マイページ</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="section">
            <h2 class="section-title">マイページ</h2>
            <p>ようこそ、<span th:text="${customer.lastName + ' ' + customer.firstName}"></span> さん</p>

            <div class="mypage-grid">
                <div class="stat-card">
                    <div class="stat-number" th:text="${reservationCount}">0</div>
                    <div class="stat-label">予約件数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" th:text="${customer.diveCount}">0</div>
                    <div class="stat-label">経験本数</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h3 class="section-title">最近の予約</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>予約ID</th>
                            <th>ツアー名</th>
                            <th>日程</th>
                            <th>人数</th>
                            <th>合計金額</th>
                            <th>ステータス</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reservations}">
                            <td th:text="${r.reservationId}"></td>
                            <td th:text="${r.tourName}"></td>
                            <td th:text="${r.tourDate}"></td>
                            <td th:text="${r.numParticipants}"></td>
                            <td th:text="'¥' + ${#numbers.formatInteger(r.totalPrice, 1, 'COMMA')}"></td>
                            <td>
                                <span class="badge badge-confirmed" th:if="${r.status == 'CONFIRMED'}">確定</span>
                                <span class="badge badge-pending" th:if="${r.status == 'PENDING'}">保留</span>
                                <span class="badge badge-cancelled" th:if="${r.status == 'CANCELLED'}">キャンセル</span>
                                <span class="badge badge-completed" th:if="${r.status == 'COMPLETED'}">完了</span>
                            </td>
                            <td>
                                <a th:href="@{/reservations/{id}(id=${r.reservationId})}" class="btn btn-sm btn-outline">詳細</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservations)}">
                            <td colspan="7">予約はまだありません</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <a th:href="@{/customer/profile}" class="btn btn-outline">プロフィール編集</a>
            <a th:href="@{/divinglogs}" class="btn btn-outline">ダイビングログ</a>
            <a th:href="@{/tours}" class="btn btn-primary">新規予約（ツアー一覧へ）</a>
        </div>
    </div>
</div>
</body>
</html>

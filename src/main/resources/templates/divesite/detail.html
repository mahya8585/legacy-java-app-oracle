<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${site.siteName}">ダイブサイト詳細</title>
</head>
<body>
<div layout:fragment="content">

    <section class="section">
        <div class="container">

            <div class="detail-header">
                <h1 th:text="${site.siteName}">サイト名</h1>
            </div>

            <div class="detail-info">
                <div class="detail-info-item">
                    <span class="detail-info-label">エリア</span>
                    <span class="detail-info-value" th:text="${site.area}">エリア</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">最大水深</span>
                    <span class="detail-info-value" th:text="|${site.maxDepth}m|">0m</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">水温</span>
                    <span class="detail-info-value" th:text="|${site.waterTemperatureMin}℃ ～ ${site.waterTemperatureMax}℃|">0℃ ～ 0℃</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">難易度</span>
                    <span class="detail-info-value">
                        <span class="badge"
                              th:classappend="${site.difficulty == 'BEGINNER'} ? 'badge-beginner' : (${site.difficulty == 'INTERMEDIATE'} ? 'badge-intermediate' : 'badge-advanced')"
                              th:text="${site.difficulty == 'BEGINNER'} ? '初心者向け' : (${site.difficulty == 'INTERMEDIATE'} ? '中級者向け' : '上級者向け')">レベル</span>
                    </span>
                </div>
            </div>

            <h2 class="section-title">サイト紹介</h2>
            <p th:text="${site.description}">サイトの説明文が入ります。</p>

            <h2 class="section-title">海洋生物</h2>
            <p th:text="${site.marineLife}">海洋生物の情報が入ります。</p>

            <h2 class="section-title">アクセス情報</h2>
            <p th:text="${site.accessInfo}">アクセス情報が入ります。</p>

            <h2 class="section-title">関連ツアー</h2>
            <div class="card-grid">
                <div class="card" th:each="tour : ${relatedTours}">
                    <div class="card-body">
                        <h3 class="card-title" th:text="${tour.tourName}">ツアー名</h3>
                        <p class="card-meta" th:text="${tour.area}">エリア</p>
                        <span class="badge"
                              th:classappend="${tour.difficulty == 'BEGINNER'} ? 'badge-beginner' : (${tour.difficulty == 'INTERMEDIATE'} ? 'badge-intermediate' : 'badge-advanced')"
                              th:text="${tour.difficulty == 'BEGINNER'} ? '初心者向け' : (${tour.difficulty == 'INTERMEDIATE'} ? '中級者向け' : '上級者向け')">レベル</span>
                        <p class="card-price" th:text="|¥${#numbers.formatInteger(tour.basePrice, 1, 'COMMA')}|">¥0</p>
                    </div>
                    <div class="card-footer">
                        <a class="btn btn-primary" th:href="@{/tours/{id}(id=${tour.tourId})}">詳細を見る</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

</div>
</body>
</html>

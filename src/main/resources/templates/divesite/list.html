<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>ダイブサイト一覧</title>
</head>
<body>
<div layout:fragment="content">

    <section class="section">
        <div class="container">
            <h1 class="section-title">ダイブサイト一覧</h1>

            <form class="search-form" th:action="@{/divesites}" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label for="area">エリア</label>
                        <select id="area" name="area" class="form-control">
                            <option value="">すべて</option>
                            <option value="沖縄" th:selected="${param.area != null and param.area[0] == '沖縄'}">沖縄</option>
                            <option value="伊豆" th:selected="${param.area != null and param.area[0] == '伊豆'}">伊豆</option>
                            <option value="屋久島" th:selected="${param.area != null and param.area[0] == '屋久島'}">屋久島</option>
                            <option value="宮古島" th:selected="${param.area != null and param.area[0] == '宮古島'}">宮古島</option>
                            <option value="石垣島" th:selected="${param.area != null and param.area[0] == '石垣島'}">石垣島</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="difficulty">難易度</label>
                        <select id="difficulty" name="difficulty" class="form-control">
                            <option value="">すべて</option>
                            <option value="BEGINNER" th:selected="${param.difficulty != null and param.difficulty[0] == 'BEGINNER'}">初心者向け</option>
                            <option value="INTERMEDIATE" th:selected="${param.difficulty != null and param.difficulty[0] == 'INTERMEDIATE'}">中級者向け</option>
                            <option value="ADVANCED" th:selected="${param.difficulty != null and param.difficulty[0] == 'ADVANCED'}">上級者向け</option>
                        </select>
                    </div>
                </div>
                <div class="search-actions">
                    <button type="submit" class="btn btn-primary">検索</button>
                </div>
            </form>

            <div class="card-grid">
                <div class="card" th:each="site : ${sites}">
                    <div class="card-body">
                        <h3 class="card-title" th:text="${site.siteName}">サイト名</h3>
                        <p class="card-meta" th:text="${site.area}">エリア</p>
                        <p class="card-text" th:text="|最大水深: ${site.maxDepth}m|">最大水深: 0m</p>
                        <span class="badge"
                              th:classappend="${site.difficulty == 'BEGINNER'} ? 'badge-beginner' : (${site.difficulty == 'INTERMEDIATE'} ? 'badge-intermediate' : 'badge-advanced')"
                              th:text="${site.difficulty == 'BEGINNER'} ? '初心者向け' : (${site.difficulty == 'INTERMEDIATE'} ? '中級者向け' : '上級者向け')">レベル</span>
                    </div>
                    <div class="card-footer">
                        <a class="btn btn-primary" th:href="@{/divesites/{id}(id=${site.siteId})}">詳細を見る</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

</div>
</body>
</html>

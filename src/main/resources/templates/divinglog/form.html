<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title>ダイビングログ登録</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container section">
        <h2 class="section-title">ダイビングログ登録</h2>

        <div class="form-card">
            <form th:action="@{/divinglogs/save}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="siteId">ダイブサイト</label>
                        <select id="siteId" name="siteId" class="form-control" required>
                            <option value="">選択してください</option>
                            <option th:each="site : ${sites}" th:value="${site.siteId}" th:text="${site.siteName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="diveDate">ダイビング日</label>
                        <input type="date" id="diveDate" name="diveDate" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="maxDepth">最大水深 (m)</label>
                        <input type="number" id="maxDepth" name="maxDepth" class="form-control" step="0.1" min="0">
                    </div>
                    <div class="form-group">
                        <label for="diveTime">潜水時間 (分)</label>
                        <input type="number" id="diveTime" name="diveTime" class="form-control" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="waterTemp">水温 (℃)</label>
                        <input type="number" id="waterTemp" name="waterTemp" class="form-control" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="visibility">透視度 (m)</label>
                        <input type="number" id="visibility" name="visibility" class="form-control" step="0.1" min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weather">天気</label>
                        <select id="weather" name="weather" class="form-control">
                            <option value="">選択してください</option>
                            <option value="晴れ">晴れ</option>
                            <option value="曇り">曇り</option>
                            <option value="雨">雨</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="buddy">バディ</label>
                        <input type="text" id="buddy" name="buddy" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">メモ</label>
                    <textarea id="notes" name="notes" class="form-control" rows="4"></textarea>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <button type="submit" class="btn btn-primary">保存する</button>
                    <a th:href="@{/divinglogs}" class="btn btn-secondary">戻る</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>会員登録</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="section">
            <h2 class="section-title">会員登録</h2>

            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="form-card">
                <form th:action="@{/customer/register}" th:object="${form}" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="lastName">姓</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" />
                            <span class="form-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                        </div>
                        <div class="form-group">
                            <label for="firstName">名</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" />
                            <span class="form-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="lastNameKana">姓（カナ）</label>
                            <input type="text" id="lastNameKana" th:field="*{lastNameKana}" class="form-control" />
                            <span class="form-error" th:if="${#fields.hasErrors('lastNameKana')}" th:errors="*{lastNameKana}"></span>
                        </div>
                        <div class="form-group">
                            <label for="firstNameKana">名（カナ）</label>
                            <input type="text" id="firstNameKana" th:field="*{firstNameKana}" class="form-control" />
                            <span class="form-error" th:if="${#fields.hasErrors('firstNameKana')}" th:errors="*{firstNameKana}"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" />
                        <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control" />
                        <span class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                    <div class="form-group">
                        <label for="passwordConfirm">パスワード（確認）</label>
                        <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" class="form-control" />
                        <span class="form-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></span>
                    </div>
                    <div class="form-group">
                        <label for="phone">電話番号</label>
                        <input type="tel" id="phone" th:field="*{phone}" class="form-control" />
                        <span class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>
                    <div class="form-group">
                        <label for="birthDate">生年月日</label>
                        <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" />
                        <span class="form-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
                    </div>
                    <div class="form-group">
                        <label for="licenseLevel">ライセンスレベル</label>
                        <select id="licenseLevel" th:field="*{licenseLevel}" class="form-control">
                            <option value="NONE">なし</option>
                            <option value="OW">オープンウォーター</option>
                            <option value="AOW">アドバンスドオープンウォーター</option>
                            <option value="RESCUE">レスキューダイバー</option>
                            <option value="DIVEMASTER">ダイブマスター</option>
                        </select>
                        <span class="form-error" th:if="${#fields.hasErrors('licenseLevel')}" th:errors="*{licenseLevel}"></span>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">登録する</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

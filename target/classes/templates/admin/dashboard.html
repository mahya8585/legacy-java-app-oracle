<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>管理者ダッシュボード</title>
</head>
<body>
<div layout:fragment="content">

    <nav class="admin-nav">
        <a th:href="@{/admin}" class="active">ダッシュボード</a>
        <a th:href="@{/admin/tours}">ツアー管理</a>
        <a th:href="@{/admin/reservations}">予約管理</a>
        <a th:href="@{/admin/customers}">顧客管理</a>
        <a th:href="@{/admin/reports}">レポート</a>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="section-title">管理者ダッシュボード</h1>

            <div class="card-grid" th:if="${salesReport != null}">
                <div class="stat-card">
                    <div class="stat-label">対象年度</div>
                    <div class="stat-number" th:text="${year} + '年'">2026年</div>
                </div>
            </div>

            <h2>月次売上レポート</h2>
            <div class="table-wrapper">
                <table th:if="${salesReport != null and !salesReport.isEmpty()}">
                    <thead>
                        <tr>
                            <th>月</th>
                            <th>予約件数</th>
                            <th>売上金額</th>
                            <th>参加者数</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${salesReport}">
                            <td th:text="${row.month} + '月'">1月</td>
                            <td th:text="${row.reservationCount}">0</td>
                            <td th:text="'¥' + ${#numbers.formatInteger(row.totalSales, 1, 'COMMA')}">¥0</td>
                            <td th:text="${row.totalParticipants}">0</td>
                        </tr>
                    </tbody>
                </table>
                <div class="alert" th:if="${salesReport == null or salesReport.isEmpty()}">
                    <p>売上データがありません。</p>
                </div>
            </div>
        </div>
    </section>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${isNew} ? 'ツアー登録' : 'ツアー編集'">ツアー登録</title>
</head>
<body>
<div layout:fragment="content">

    <nav class="admin-nav">
        <a th:href="@{/admin}">ダッシュボード</a>
        <a th:href="@{/admin/tours}" class="active">ツアー管理</a>
        <a th:href="@{/admin/reservations}">予約管理</a>
        <a th:href="@{/admin/customers}">顧客管理</a>
        <a th:href="@{/admin/reports}">レポート</a>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="section-title" th:text="${isNew} ? 'ツアー登録' : 'ツアー編集'">ツアー登録</h1>

            <div class="form-card">
                <form th:action="@{/admin/tours/save}" method="post" th:object="${form}">
                    <input type="hidden" th:field="*{tourId}" />

                    <div class="form-group">
                        <label for="tourName">ツアー名 <span class="required">*</span></label>
                        <input type="text" id="tourName" class="form-control" th:field="*{tourName}" />
                        <p class="error" th:if="${#fields.hasErrors('tourName')}" th:errors="*{tourName}">エラー</p>
                    </div>

                    <div class="form-group">
                        <label for="description">説明</label>
                        <textarea id="description" class="form-control" th:field="*{description}" rows="5"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="area">エリア <span class="required">*</span></label>
                            <input type="text" id="area" class="form-control" th:field="*{area}" />
                            <p class="error" th:if="${#fields.hasErrors('area')}" th:errors="*{area}">エラー</p>
                        </div>
                        <div class="form-group">
                            <label for="difficulty">難易度 <span class="required">*</span></label>
                            <select id="difficulty" class="form-control" th:field="*{difficulty}">
                                <option value="">選択してください</option>
                                <option value="BEGINNER">初心者向け</option>
                                <option value="INTERMEDIATE">中級者向け</option>
                                <option value="ADVANCED">上級者向け</option>
                            </select>
                            <p class="error" th:if="${#fields.hasErrors('difficulty')}" th:errors="*{difficulty}">エラー</p>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="maxParticipants">最大参加人数 <span class="required">*</span></label>
                            <input type="number" id="maxParticipants" class="form-control" th:field="*{maxParticipants}" min="1" />
                            <p class="error" th:if="${#fields.hasErrors('maxParticipants')}" th:errors="*{maxParticipants}">エラー</p>
                        </div>
                        <div class="form-group">
                            <label for="basePrice">基本料金（円） <span class="required">*</span></label>
                            <input type="number" id="basePrice" class="form-control" th:field="*{basePrice}" min="0" />
                            <p class="error" th:if="${#fields.hasErrors('basePrice')}" th:errors="*{basePrice}">エラー</p>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="durationDays">日数 <span class="required">*</span></label>
                            <input type="number" id="durationDays" class="form-control" th:field="*{durationDays}" min="1" />
                            <p class="error" th:if="${#fields.hasErrors('durationDays')}" th:errors="*{durationDays}">エラー</p>
                        </div>
                        <div class="form-group">
                            <label for="minDiveCount">最低ダイブ本数</label>
                            <input type="number" id="minDiveCount" class="form-control" th:field="*{minDiveCount}" min="0" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" th:field="*{featuredFlag}" th:value="'Y'" />
                            おすすめツアーとして表示
                        </label>
                    </div>

                    <div class="search-actions">
                        <button type="submit" class="btn btn-primary">保存する</button>
                        <a th:href="@{/admin/tours}" class="btn">キャンセル</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

</div>
</body>
</html>

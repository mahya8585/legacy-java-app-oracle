<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${tour.tourName}">ツアー詳細</title>
</head>
<body>
<div layout:fragment="content">

    <section class="section">
        <div class="container">

            <div class="detail-header">
                <h1 th:text="${tour.tourName}">ツアー名</h1>
                <p class="card-meta" th:text="${tour.area}">エリア</p>
                <span class="badge"
                      th:classappend="${tour.difficulty == 'BEGINNER'} ? 'badge-beginner' : (${tour.difficulty == 'INTERMEDIATE'} ? 'badge-intermediate' : 'badge-advanced')"
                      th:text="${tour.difficulty == 'BEGINNER'} ? '初心者向け' : (${tour.difficulty == 'INTERMEDIATE'} ? '中級者向け' : '上級者向け')">レベル</span>
                <span class="badge" th:text="${tour.status}">ステータス</span>
            </div>

            <div class="detail-info">
                <div class="detail-info-item">
                    <span class="detail-info-label">基本料金</span>
                    <span class="detail-info-value" th:text="|¥${#numbers.formatInteger(tour.basePrice, 1, 'COMMA')}|">¥0</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">日数</span>
                    <span class="detail-info-value" th:text="|${tour.durationDays}日間|">0日間</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">最大参加人数</span>
                    <span class="detail-info-value" th:text="|${tour.maxParticipants}名|">0名</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">必要ダイブ本数</span>
                    <span class="detail-info-value" th:text="|${tour.minDiveCount}本以上|">0本以上</span>
                </div>
            </div>

            <p th:text="${tour.description}">ツアーの説明文が入ります。</p>

            <h2 class="section-title">スケジュール</h2>
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>開始時間</th>
                            <th>残席数</th>
                            <th>状態</th>
                            <th>予約</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="schedule : ${schedules}">
                            <td th:text="${#dates.format(schedule.tourDate, 'yyyy/MM/dd')}">2026/01/01</td>
                            <td th:text="${schedule.startTime}">09:00</td>
                            <td th:text="|${schedule.remainingSeats}席|">0席</td>
                            <td th:text="${schedule.status}">募集中</td>
                            <td>
                                <a class="btn btn-accent" th:if="${schedule.remainingSeats > 0}"
                                   th:href="@{/reservations/new(scheduleId=${schedule.scheduleId})}">予約する</a>
                                <span th:if="${schedule.remainingSeats <= 0}">満席</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <h2 class="section-title">ダイブサイト</h2>
            <div class="card-grid">
                <div class="card" th:each="site : ${sites}">
                    <div class="card-body">
                        <h3 class="card-title" th:text="${site.siteName}">サイト名</h3>
                        <p class="card-meta" th:text="${site.area}">エリア</p>
                        <p class="card-text" th:text="|最大水深: ${site.maxDepth}m|">最大水深: 0m</p>
                    </div>
                </div>
            </div>

            <h2 class="section-title">インストラクター</h2>
            <ul>
                <li th:each="instructor : ${instructors}">
                    <span th:text="|${instructor.lastName} ${instructor.firstName}|">氏名</span>
                    <span th:text="| - ${instructor.certification}|">資格</span>
                </li>
            </ul>

        </div>
    </section>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}"
      lang="ja">
<head>
    <title>エラー</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container" style="padding: 3rem 1rem; text-align: center;">
        <h1 style="color: #dc3545; font-size: 2rem; margin-bottom: 1rem;">エラーが発生しました</h1>
        <div class="alert alert-error" th:if="${errorMessage}">
            <p th:text="${errorMessage}">エラーメッセージ</p>
        </div>
        <div class="alert alert-error" th:unless="${errorMessage}">
            <p>予期しないエラーが発生しました。</p>
        </div>
        <div style="margin-top: 2rem;">
            <a th:href="@{/}" class="btn btn-primary">トップページへ戻る</a>
        </div>
    </div>
</div>
</body>
</html>
